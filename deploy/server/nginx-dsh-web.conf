# DeepSeek Harness Web UI 公网入口（登录页 + 会话认证代理）
# 浏览器 --TLS--> nginx :8443 --HTTP--> dsh-gate :3081 --HTTP--> dsh web :3080
# 账号密码由 dsh-gate 校验（scrypt + 30 天会话 Cookie），nginx 不再使用 Basic Auth。

map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       __PUBLIC_PORT__ ssl;
    listen       [::]:__PUBLIC_PORT__ ssl;
    http2        on;
    server_name  __DOMAIN__;

    server_tokens off;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:dsh_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 200m;

    location / {
        proxy_pass http://__HOST__:__UPSTREAM_PORT_GATE__;
        proxy_http_version 1.1;
        # 保留浏览器原始 Host（含端口）：DSH 的信任栅栏依赖它
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $dsh_connection_upgrade;

        # 流式输出 / SSE / WebSocket
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }
}

# www 统一跳回主域，避免登录 Cookie / 浏览器存储按域名分裂
server {
    listen       __PUBLIC_PORT__ ssl;
    listen       [::]:__PUBLIC_PORT__ ssl;
    http2        on;
    server_name  www.__DOMAIN__;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://__DOMAIN__:__PUBLIC_PORT__$request_uri;
}
